name: Deploy

# 2026-07-19부로 워크플로 자동 트리거를 잠시 멈춰뒀다. 비용 절감을 위해 NAT
# Gateway/Interface VPC Endpoint(SSM 접속 경로 포함)를 삭제하고 EC2를 중지한
# 상태라(PR #31, docs/bid-radar-aws-infra-summary.md 참고), 이 상태에서
# main push마다 자동 실행되면 SSM 명령이 오프라인 인스턴스에 닿지 못해 매번
# 실패한다. infra/terraform/으로 NAT/Endpoint를 복원하고 EC2를 재시작한
# 뒤, 아래 on 블록을 push 트리거로 되돌린다.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'backend/**'
  #     - 'frontend/**'
  #     - 'infra/**'
  #     - '.github/workflows/**'

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 200596937528.dkr.ecr.ap-northeast-2.amazonaws.com
  BACKEND_IMAGE: 200596937528.dkr.ecr.ap-northeast-2.amazonaws.com/bid-radar/backend
  FRONTEND_IMAGE: 200596937528.dkr.ecr.ap-northeast-2.amazonaws.com/bid-radar/frontend

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
                       -t ${{ env.BACKEND_IMAGE }}:latest \
                       ./backend
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
                       -t ${{ env.FRONTEND_IMAGE }}:latest \
                       ./frontend
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: Deploy to EC2 via SSM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "su -l ec2-user -c \"set -e && aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 200596937528.dkr.ecr.ap-northeast-2.amazonaws.com && docker compose -f /app/docker-compose.prod.yml --env-file /app/.env.prod pull && docker compose -f /app/docker-compose.prod.yml --env-file /app/.env.prod up -d && docker image prune -f\""
            ]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || FAILED=true

          echo "=== STDOUT ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "=== STDERR ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text

          if [ "$FAILED" = "true" ]; then
            echo "SSM command failed"
            exit 1
          fi
