name: Codex Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Allow unprivileged user namespaces (bubblewrap sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Login with API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printenv OPENAI_API_KEY | codex login --with-api-key

      - name: Run review
        run: |
          codex exec review -m gpt-5.5 \
            "origin/main 브랜치와 현재 HEAD 사이의 변경사항(git diff origin/main...HEAD)을 검토하라. 이 저장소 루트의 AGENTS.md에 정의된 리뷰 우선순위, 심각도 기준(Critical/High/Medium/Low), 응답 형식(Findings/Open Questions/Summary/Verification)을 따르라. 모든 응답은 한국어로 작성하라." \
            > review-output.md

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review-output.md
