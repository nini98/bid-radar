spring:
  application:
    name: bid-radar-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bidradar}
    username: ${DB_USERNAME:bidradar}
    password: ${DB_PASSWORD:bidradar}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  name: bid-radar
  g2b:
    service-key: ${G2B_SERVICE_KEY:}
    page-size: 100
