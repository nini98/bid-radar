spring:
  application:
    name: bid-radar-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:bidradar}
    username: ${DB_USERNAME:bidradar}
    password: ${DB_PASSWORD:bidradar}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  name: bid-radar
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-bytes}
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14
  g2b:
    base-url: https://apis.data.go.kr/1230000/ad/BidPublicInfoService/
    service-key: ${G2B_SERVICE_KEY:}  # URL 인코딩 키(Encoding)를 사용
    page-size: 100
    cron: "0 0 7 * * *"
